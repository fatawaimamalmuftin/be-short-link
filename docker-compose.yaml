services:
  db:
    image: postgres:18-alpine
    container_name: sl-db
    environment:
      POSTGRES_USER: ${DF_DB_USER}
      POSTGRES_PASSWORD: ${DF_DB_PASS}
      POSTGRES_DB: ${DF_DB_NAME}
    ports:
      - "${DF_DB_PORT_H}:${DF_DB_PORT_C}"
    volumes:
      - sl-db-data:/var/lib/postgresql
    networks:
      - sl-network

  rdb:
    image: redis:8.10.2-alpine
    container_name: sl-rdb
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis-sl.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "${RDB_PORT_H}:${RDB_PORT_C}"
    networks:
      - sl-network

  be:
    build:
      context: .
      dockerfile: dockerfile
    container_name: sl-be
    ports:
      - "${BE_PORT_H}:${BE_PORT_C}"
    environment:
      - DF_DB_HOST=${CMPS_DB_HOST}
      - DF_DB_PORT_H=${DF_DB_PORT_C} # Menggunakan port internal postgres (5432)
      - RDB_HOST=${CMPS_RDB_HOST}
      - RDB_PORT_H=${RDB_PORT_C}     # Menggunakan port internal redis (6379)
      - DF_DB_USER=${DF_DB_USER}
      - DF_DB_PASS=${DF_DB_PASS}
      - DF_DB_NAME=${DF_DB_NAME}
      - JWT_KEY=${JWT_KEY}
      - JWT_ISSUER=${JWT_ISSUER}
    depends_on:
      - db
      - rdb
    networks:
      - sl-network

networks:
  sl-network:
    driver: bridge

volumes:
  sl-db-data: